# Infraestructura DevSecOps de SecureDev
name: securedev

services:
  jenkins:
    build: ./jenkins
    image: securedev-jenkins:lts
    container_name: jenkins
    # Riesgo aceptado (laboratorio): root para usar el socket de Docker.
    # Montar docker.sock ya equivale a privilegios de root sobre Docker.
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - zap-wrk:/zap/wrk          # carpeta compartida con OWASP ZAP para los reportes
    networks:
      - devsecops

  # --- Monitorización del entorno de producción ---------------------------
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - devsecops

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alertas.yml:/etc/prometheus/alertas.yml:ro
      - prometheus-data:/prometheus
    networks:
      - devsecops

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # La contraseña se entrega al levantar el stack (nunca en el repositorio)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina la variable GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/securedev.json
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - devsecops

volumes:
  jenkins_home:
  zap-wrk:
    name: zap-wrk
  prometheus-data:
  grafana-data:

networks:
  devsecops:
    name: devsecops
