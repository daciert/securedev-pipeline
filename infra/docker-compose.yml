# Infraestructura DevSecOps de SecureDev
name: securedev

services:
  jenkins:
    build: ./jenkins
    image: securedev-jenkins:lts
    container_name: jenkins
    # Riesgo aceptado (laboratorio): root para usar el socket de Docker.
    # Montar docker.sock ya equivale a privilegios de root sobre Docker.
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - zap-wrk:/zap/wrk          # carpeta compartida con OWASP ZAP para los reportes
    networks:
      - devsecops

volumes:
  jenkins_home:
  zap-wrk:
    name: zap-wrk

networks:
  devsecops:
    name: devsecops
