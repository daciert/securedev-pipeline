# Prometheus: recolecta métricas del entorno de producción cada 5 segundos
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Aplicación en producción (métricas de seguridad)
  - job_name: "securedev-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["securedev-app:5000"]

  # Servidor (CPU, memoria, red) - igual que en la configuración de clases
  - job_name: "servidor"
    static_configs:
      - targets: ["node-exporter:9100"]
