<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Login - SecureDev</title></head>
<body>
  <h2>Login del Sistema Académico</h2>
  {% if error %}<p><strong>{{ error }}</strong></p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    Usuario: <input type="text" name="username" autocomplete="username" required><br>
    Password: <input type="password" name="password" autocomplete="current-password" required><br>
    <input type="submit" value="Ingresar">
  </form>
</body>
</html>
